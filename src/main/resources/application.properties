# Application Configuration
quarkus.application.name=ms-bucket
quarkus.application.version=1.0.0

# HTTP Configuration
quarkus.http.port=${PORT:3102}
quarkus.http.root-path=/api/v1
quarkus.http.cors.origins=${CORS_ORIGINS:*}
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# Database Configuration (usar variables de entorno)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:1100}/${DB_NAME:dbqk}?currentSchema=bkt
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.min-size=2

# Hibernate Configuration
quarkus.hibernate-orm.database.generation=${DB_GENERATION:none}
quarkus.hibernate-orm.sql-load-script=${DB_IMPORT_SCRIPT:no-file}
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.bind-parameters=false

# Flyway (Migrations)
quarkus.hibernate-orm.database.default-schema=bkt
quarkus.flyway.schemas=bkt
quarkus.flyway.create-schemas=true
quarkus.flyway.table=flyway_schema_history_bkt
quarkus.flyway.migrate-at-start=true

# Security Configuration (JWT comentado para desarrollo)
# Instrucciones para producción incluidas como comentarios
# quarkus.smallrye-jwt.enabled=true
# mp.jwt.verify.publickey.location=classpath:/META-INF/resources/publicKey.pem
# mp.jwt.verify.issuer=https://kplian.com

# OpenAPI / Swagger Configuration
quarkus.smallrye-openapi.info-title=ms-bucket API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.path=/api-docs
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.always-include=true

# OpenTelemetry Configuration
quarkus.opentelemetry.enabled=${OTEL_ENABLED:false}
quarkus.opentelemetry.tracer.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.opentelemetry.tracer.exporter.otlp.protocol=${OTEL_EXPORTER_OTLP_PROTOCOL:grpc}
quarkus.opentelemetry.service-name=${OTEL_SERVICE_NAME:ms-bucket}
quarkus.opentelemetry.resource-attributes=service.name=${OTEL_SERVICE_NAME:ms-bucket},service.version=${quarkus.application.version:1.0.0}

# Logging Configuration
quarkus.log.level=INFO
quarkus.log.category."com.kplian".level=DEBUG
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."io.quarkus".level=INFO
quarkus.log.console.json=false
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n

# Health & Metrics
quarkus.smallrye-health.root-path=/health
quarkus.smallrye-metrics.enabled=true
quarkus.smallrye-metrics.path=/metrics

# i18n Configuration
quarkus.locales=en, es
quarkus.default-locale=es-ES

# Storage Configuration
# Options: aws, r2, minio
storage.type=${STORAGE_TYPE:aws}

# AWS S3 Configuration
storage.aws.access-key=${AWS_ACCESS_KEY_ID:test-key}
storage.aws.secret-key=${AWS_SECRET_ACCESS_KEY:test-secret}
storage.aws.region=${AWS_REGION:us-east-1}
storage.aws.endpoint=${AWS_S3_ENDPOINT:https://s3.amazonaws.com}

# Cloudflare R2 Configuration
storage.r2.access-key=${R2_ACCESS_KEY_ID:your-r2-key}
storage.r2.secret-key=${R2_SECRET_ACCESS_KEY:your-r2-secret}
storage.r2.endpoint=${R2_ENDPOINT:https://<account-id>.r2.cloudflarestorage.com}

# MinIO Configuration (On-premise)
storage.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
storage.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
storage.minio.external-endpoint=${MINIO_EXTERNAL_ENDPOINT:}

# Quarkus Amazon S3 global config (used by S3Client injection)
# We override these dynamically in our services, but we provide defaults for the managed client
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${AWS_ACCESS_KEY_ID:test-key}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${AWS_SECRET_ACCESS_KEY:test-secret}
quarkus.s3.aws.region=${AWS_REGION:us-east-1}
quarkus.s3.endpoint-override=${AWS_S3_ENDPOINT:http://localhost:4566}

# Integration Configuration
# URL of the API Gateway for microservice-to-microservice communication
kplian.gateway.url=${GATEWAY_URL:http://localhost:8787}

